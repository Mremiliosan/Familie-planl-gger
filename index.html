:root{

    --note1:#403822; --note2:#1F3A32; --note3:#34294F; --note4:#43283A;

    --shadow:0 6px 24px -12px rgba(0,0,0,.6);

  }
}
:root[data-theme="dark"]{

:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

.field{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:.6rem .8rem;font-size:.9rem;font-family:inherit}
.field:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.field::placeholder{color:var(--muted);opacity:.8}
@media (max-width:640px){.field{font-size:16px}}
.lbl{display:block;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.32rem .75rem;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.8rem;padding:.3rem .8rem;border-radius:10px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.tint{display:inline-flex;align-items:center;justify-content:center;border-radius:14px;flex-shrink:0}
.navbtn{display:flex;align-items:center;gap:.7rem;width:100%;padding:.6rem .8rem;border-radius:14px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.92rem;cursor:pointer;font-family:inherit;text-align:left}
.navbtn:hover{background:var(--surface2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tabbar{position:fixed;left:12px;right:12px;z-index:30;display:flex;justify-content:space-between;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 34px -10px rgba(70,40,140,.35);max-width:520px;margin:0 auto}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.45rem .2rem;border:0;background:transparent;color:var(--muted);font-size:.68rem;font-weight:700;cursor:pointer;font-family:inherit;border-radius:20px;min-width:0}
.tabbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .18s ease-out}

const pad = n => String(n).padStart(2, '0');

const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayIdx = d => (d.getDay() + 6) % 7;
const startOfWeek = d => addDays(startOfDay(d), -dayIdx(d));
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const isoWeek = d => {

  </div>;
}

/* ---------- Kalender ---------- */
function EventModal({ init, onClose }) {
  const { set, notify } = useApp();
  const [f, setF] = useState({ repeat:'none', until:'', skip:[], ...init, members:memsOf(init).length ? memsOf(init) : ['all'] });
  const u = (k, v) => setF(p => ({ ...p, [k]:v }));
  const clean = () => { const { occ, ...rest } = f; const mems = f.members.length ? f.members : ['all']; return { ...rest, title:f.title.trim(), members:mems, member:mems[0], until:f.repeat === 'none' ? '' : f.until, endDate:f.repeat === 'none' && f.endDate && f.endDate > f.date ? f.endDate : '' }; };
  const submit = e => {
    e.preventDefault(); if (!f.title.trim()) return;
    const ev = clean();
    if (ev.id) set('events', l => l.map(x => x.id === ev.id ? ev : x)); else set('events', l => [...l, { ...ev, id:uid() }]);
    onClose();
  };
  const del = () => { const old = { ...init }; delete old.occ; set('events', l => l.filter(x => x.id !== f.id)); onClose(); notify(`"${old.title}" er slettet`, { label:'Fortryd', fn:() => set('events', l => l.some(x => x.id === old.id) ? l : [...l, old]) }); };
  const skipDay = () => { set('events', l => l.map(x => x.id === f.id ? { ...x, skip:[...(x.skip || []), f.occ] } : x)); onClose(); };
  const rep = f.repeat !== 'none';
  return <FormModal title={f.id ? (rep ? 'Redigér fast aftale' : 'Redigér aftale') : 'Ny aftale'} onClose={onClose} onSubmit={submit} onDelete={f.id ? del : null}
    extra={f.id && rep && f.occ ? <button type="button" className="btn btn-sm" onClick={skipDay}>Spring {fmtShort(parse(f.occ))} over</button> : null}>
    <Field label="Titel"><input className="field" autoFocus value={f.title} onChange={e => u('title', e.target.value)} placeholder="Fx tandlæge" /></Field>
    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <Field label={rep ? 'Første dato' : 'Dato'}><input type="date" className="field" value={f.date} onChange={e => u('date', e.target.value)} required /></Field>
      {!rep && <Field label="Slutdato (valgfri)" className="sm:col-span-3"><input type="date" className="field" min={f.date} value={f.endDate || ''} onChange={e => u('endDate', e.target.value)} /><span className="text-xs text-muted block mt-1">Til ferie, weekendophold osv. Lad feltet stå tomt, hvis aftalen slutter samme dag.</span></Field>}
      <Field label="Fra"><input type="time" className="field" value={f.start} onChange={e => u('start', e.target.value)} /></Field>
      <Field label="Til"><input type="time" className="field" value={f.end} onChange={e => u('end', e.target.value)} /></Field>
    </div>
    <div><span className="lbl">Hvem gælder aftalen for?</span><MemberPick multi all value={f.members} onChange={v => u('members', v)} />
      <p className="text-xs text-muted mt-1.5">Vælg flere personer ved at trykke på dem.</p></div>
    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <Field label="Gentagelse"><select className="field" value={f.repeat} onChange={e => u('repeat', e.target.value)}>{REPEATS.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}</select></Field>
      {rep && <Field label="Gentag til (valgfri)"><input type="date" className="field" value={f.until || ''} onChange={e => u('until', e.target.value)} /></Field>}
    </div>
    {rep && <p className="text-xs text-muted -mt-2">Ændringer, også af hvem aftalen gælder for, rammer alle gentagelser. Slet ikke aftalen for at skifte person.</p>}
    <Field label="Note"><textarea className="field" rows={2} value={f.note} onChange={e => u('note', e.target.value)} /></Field>
  </FormModal>;
}

function Kalender() {
  const { db, set, notify, go, eventsFor, ext, openSettings } = useApp();
  const ui = db.ui; const setUi = p => set('ui', u => ({ ...u, ...p }));
  const [cursor, setCursor] = useState(() => startOfDay(new Date()));
  const [sel, setSel] = useState(() => iso(startOfDay(new Date())));
  const [modal, setModal] = useState(null); const [extEv, setExtEv] = useState(null);
  const today = iso(new Date()); const filter = ui.calFilter; const view = ui.calView;
  const eventsOn = k => eventsFor(k).filter(e => filter === 'all' || inMems(e.members, filter)).sort(byTime);
  const trainOn = k => ui.showTraining ? db.sessions.filter(s => sessionOn(s, k) && (filter === 'all' || s.member === filter)).sort((a, b) => a.start.localeCompare(b.start)) : [];
  const newEv = date => setModal({ title:'', date, endDate:'', start:'', end:'', members:filter === 'all' ? ['all'] : [filter], note:'', repeat:'none' });
  const openEv = e => { if (e.ext) { setExtEv(e); return; } const base = db.events.find(x => x.id === e.id); if (base) setModal({ ...base, occ:e.date }); };
  const shift = n => setCursor(c => view === 'month' ? new Date(c.getFullYear(), c.getMonth() + n, 1) : addDays(c, 7 * n));
  const soon = db.birthdays.map(b => ({ b, ...nextBirthday(b.date, startOfDay(new Date()), b.noYear) })).filter(x => x.days <= 7).sort((a, b) => a.days - b.days);

  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const dim = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
  const gridStart = startOfWeek(first);
  const cells = Array.from({ length:Math.ceil((dayIdx(first) + dim) / 7) * 7 }, (_, i) => addDays(gridStart, i));
  const ws = startOfWeek(cursor); const wdays = Array.from({ length:7 }, (_, i) => addDays(ws, i));
  const title = view === 'month' ? `${MONTHS[cursor.getMonth()][0].toUpperCase() + MONTHS[cursor.getMonth()].slice(1)} ${cursor.getFullYear()}`
    : `Uge ${isoWeek(ws)} · ${fmtShort(ws)} til ${fmtShort(addDays(ws, 6))}`;

  const delEv = e => { const old = db.events.find(x => x.id === e.id); if (!old) return; set('events', l => l.filter(x => x.id !== old.id)); notify(`"${old.title}" er slettet`, { label:'Fortryd', fn:() => set('events', l => l.some(x => x.id === old.id) ? l : [...l, old]) }); };
  const EventRow = ({ e }) => <div className="flex items-center gap-1" style={{ background:evBg(db, e.members), borderRadius:12 }}><button className="flex-1 min-w-0 text-left flex items-center gap-2 rounded-xl px-3 py-2 hover:brightness-95" onClick={() => openEv(e)}>
    <span className="tnum text-xs text-muted w-[84px] shrink-0">{e.start ? e.start + (e.end ? '–' + e.end : '') : 'Hele dagen'}</span>
    <span className="font-semibold text-sm truncate flex-1">{e.title}</span>{e.repeat && e.repeat !== 'none' && <Icon name="repeat" size={13} className="text-muted" />}{e.ext && <Icon name="cloud" size={13} className="text-muted" />}<PersonDots ids={e.members} /></button>
    {!e.ext && <button className="iconbtn" aria-label={`Slet ${e.title}`} title={e.repeat && e.repeat !== 'none' ? 'Slet hele den faste aftale' : 'Slet aftale'} onClick={() => delEv(e)}><Icon name="trash" size={16} /></button>}</div>;
  const TrainRow = ({ s }) => <div className="flex items-center gap-2 rounded-xl px-3 py-2 border border-dashed border-line text-sm text-muted">
    <span className="tnum text-xs w-[84px] shrink-0">{s.start}–{fromMin(toMin(s.start) + s.duration)}</span>
    <Icon name="dumbbell" size={14} /><span className="truncate flex-1">{s.activity}, {memberFor(db, s.member).name}</span></div>;
  const BdRow = ({ b }) => <button type="button" onClick={() => go('foedselsdage')} className="w-full text-left flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold text-ink" style={{ background:'var(--t-sun)' }}>
    <Icon name="cake" size={16} className="text-warn" />{b.name}{b.kind === 'mærkedag' && !b.noYear ? ` · ${new Date().getFullYear() - parse(b.date).getFullYear()} år` : ''}</button>;

  const selDate = parse(sel); const selEvents = eventsOn(sel); const selTrain = trainOn(sel); const selBd = birthdaysOn(db.birthdays, selDate); const selMeal = db.meals[sel];

  return <div>
    <PageHead icon="calendar" title="Kalender" sub="Alle aftaler samlet ét sted">

      <button className="btn btn-primary" onClick={() => newEv(sel)}><Icon name="plus" size={16} />Ny aftale</button>

    {soon.length > 0 && <div className="flex items-start gap-3 rounded-2xl px-4 py-3 mb-4 text-sm" style={{ background:'var(--t-sun)' }}>
      <Icon name="bell" className="text-warn mt-0.5" /><div className="min-w-0">
        <p className="font-semibold">Påmindelse</p>
        <p className="text-muted">{soon.map(x => `${x.b.name} ${x.days === 0 ? 'i dag' : x.days === 1 ? 'i morgen' : `om ${x.days} dage`}`).join(' · ')}</p></div></div>}

    </div>
    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">

        <button className="btn btn-sm" onClick={() => { setCursor(startOfDay(new Date())); setSel(today); }}>I dag</button>

    <div className="grid gap-4 lg:grid-cols-[1fr_320px] items-start">

const EXT_KEY = 'familieplanlaegger.ext.v1';
const APPFEED_KEY = 'familieplanlaegger.appfeeds.v1';
const DEFAULT_PROXIES = ['https://corsproxy.io/?url=', 'https://api.allorigins.win/raw?url='];
const toArr = v => Array.isArray(v) ? v : (v ? [v] : []);
const seriesKey = id => id.slice(0, id.lastIndexOf(':'));

async function fetchWithTimeout(u, ms = 20000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(u, { cache:'no-store', signal:c.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const tx = await r.text();
    if (!/BEGIN:VCALENDAR/i.test(tx)) throw new Error('Svaret er ikke en iCal-fil');
    return tx;
  } finally { clearTimeout(t); }
}
async function getIcs(url, settings) {
  const u = url.trim().replace(/^webcal:\/\//i, 'https://');
  const tries = [{ via:'direkte', u }];
  if (settings.useProxy) {
    const list = settings.proxy && settings.proxy.trim() ? [settings.proxy.trim()] : DEFAULT_PROXIES;
    list.forEach(p => tries.push({ via:'proxy', u:p.includes('{url}') ? p.replace('{url}', encodeURIComponent(u)) : p + encodeURIComponent(u) }));
  }
  let last;
  for (const t of tries) { try { return { text:await fetchWithTimeout(t.u), via:t.via }; } catch (e) { last = e; } }
  throw last || new Error('Kunne ikke hentes');
}

function useAppFeeds(db) {
  const [st, setSt] = useState(() => {
    try { const r = JSON.parse(localStorage.getItem(APPFEED_KEY) || 'null'); if (r && r.byFeed) return { loading:false, byFeed:r.byFeed }; } catch (e) {}
    return { loading:false, byFeed:{} };
  });
  const cur = useRef({}); cur.current = { feeds:db.extFeeds || [], settings:{ useProxy:false, proxy:'', ...(db.settings || {}) }, byFeed:st.byFeed };
  const busy = useRef(false);
  const refresh = async () => {
    const { feeds, settings, byFeed:prev } = cur.current;
    if (busy.current || !feeds.length) return;
    busy.current = true; setSt(s => ({ ...s, loading:true }));
    const byFeed = {};
    await Promise.all(feeds.map(async f => {
      try { const { text, via } = await getIcs(f.url, settings); byFeed[f.id] = { events:ICS.expand('app-' + f.id, text), at:Date.now(), url:f.url, via, error:'' }; }
      catch (e) {
        const old = prev[f.id] && prev[f.id].url === f.url ? prev[f.id] : null;
        byFeed[f.id] = { events:old ? old.events : [], at:old ? old.at : null, url:f.url, via:'', error:'Kunne ikke hente kalenderen. Tjek linket' + (settings.useProxy ? '.' : ', eller slå proxy til.') };
      }
    }));
    try { localStorage.setItem(APPFEED_KEY, JSON.stringify({ byFeed })); } catch (e) {}
    setSt({ loading:false, byFeed }); busy.current = false;
  };
  const sig = JSON.stringify((db.extFeeds || []).map(f => [f.id, f.url])) + (db.settings && db.settings.useProxy) + (db.settings && db.settings.proxy);
  useEffect(() => { refresh(); }, [sig]);
  useEffect(() => {
    const t = setInterval(refresh, 15 * 60 * 1000);
    const vis = () => { if (document.visibilityState === 'visible') refresh(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', vis); };
  }, []);
  return { ...st, refresh };
}

/* ---------- Deling med familien (Firebase) ---------- */
const FAM_KEY = 'familieplanlaegger.family.v1';
const SYNC_SKIP = ['ui', 'v'];
const cleanCode = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function newFamilyCode() {
  const alpha = 'abcdefghijkmnpqrstuvwxyz23456789'; // 32 tegn
  const b = new Uint8Array(24); crypto.getRandomValues(b);
  return Array.from(b, x => alpha[x % alpha.length]).join('');
}
function explainFbError(e) {
  const c = (e && (e.code || '')) + '';
  if (c.includes('permission-denied')) return 'Firestore afviser adgang. Tjek at sikkerhedsreglerne er udgivet (se guiden, trin 4).';
  if (c.includes('operation-not-allowed') || c.includes('admin-restricted')) return 'Anonym login er ikke slået til i Firebase (Authentication, Sign-in method, Anonymous).';
  if (c.includes('unavailable') || c.includes('network')) return 'Ingen forbindelse til Firebase lige nu. Ændringer gemmes og sendes, når forbindelsen er tilbage.';
  if (c.includes('invalid-api-key') || c.includes('api-key-not-valid')) return 'Firebase-nøglen i data/firebase-config.json er ugyldig.';
  return (e && e.message) || 'Ukendt fejl';
}

function useFamilySync(db, setDb) {
  const [cfg, setCfg] = useState(undefined); // undefined = indlæser, null = ikke sat op
  const [code, setCode] = useState(() => { try { return localStorage.getItem(FAM_KEY) || ''; } catch (e) { return ''; } });
  const [state, setState] = useState({ status:'idle', error:'', at:null });
  const last = useRef({}); const ready = useRef(false); const refRef = useRef(null); const timer = useRef(null);
  const dbRef = useRef(db); dbRef.current = db;

  // invitationslink: #familie=KODE
  useEffect(() => {
    const m = (location.hash || '').match(/familie=([A-Za-z0-9]+)/);
    if (m) {
      const c = cleanCode(m[1]);
      if (c.length >= 20) { try { localStorage.setItem(FAM_KEY, c); } catch (e) {} setCode(c); }
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
  }, []);
  // Firebase-opsætning
  useEffect(() => {
    fetch('data/firebase-config.json?t=' + Date.now(), { cache:'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(j => setCfg(j && j.apiKey && j.projectId ? j : null))
      .catch(() => setCfg(null));
  }, []);

  const push = () => {
    const ref = refRef.current; if (!ref || !ready.current) return;
    const d = dbRef.current; const upd = {};
    for (const k of Object.keys(d)) { if (SYNC_SKIP.includes(k)) continue; const s = JSON.stringify(d[k]); if (last.current[k] !== s) upd[k] = s; }
    if (!Object.keys(upd).length) return;
    Object.assign(last.current, upd);
    ref.set({ ...upd, _updatedAt:window.firebase.firestore.FieldValue.serverTimestamp() }, { merge:true }).catch(e => {
      Object.keys(upd).forEach(k => { delete last.current[k]; });
      setState(s => ({ ...s, status:'error', error:explainFbError(e) }));
    });
  };

  useEffect(() => {
    if (cfg === undefined) return;
    if (cfg === null) { setState({ status:'nocfg', error:'', at:null }); return; }
    if (!window.firebase) { setState({ status:'error', error:'Firebase kunne ikke indlæses. Tjek din internetforbindelse.', at:null }); return; }
    if (!code) { setState({ status:'local', error:'', at:null }); return; }
    let dead = false; let unsub = () => {};
    ready.current = false; last.current = {}; refRef.current = null;
    setState({ status:'connecting', error:'', at:null });
    (async () => {
      try {
        const fb = window.firebase;
        if (!fb.apps.length) {
          fb.initializeApp(cfg);
          try { fb.firestore().enablePersistence({ synchronizeTabs:true }).catch(() => {}); } catch (e) {}
        }
        await fb.auth().signInAnonymously();
        if (dead) return;
        const ref = fb.firestore().collection('families').doc(code); refRef.current = ref;
        unsub = ref.onSnapshot(snap => {
          if (dead || snap.metadata.hasPendingWrites) return;
          const data = snap.exists ? snap.data() : null;
          if (data) {
            const patch = {};
            for (const k of Object.keys(data)) {
              if (k.startsWith('_') || SYNC_SKIP.includes(k) || typeof data[k] !== 'string') continue;
              const s = data[k]; if (last.current[k] === s) continue;
              const localStr = JSON.stringify(dbRef.current[k]);
              if (last.current[k] !== undefined && localStr !== last.current[k]) continue; // lokal ændring er på vej op
              try { patch[k] = JSON.parse(s); last.current[k] = s; } catch (e) {}
            }
            if (Object.keys(patch).length) setDb(d => ({ ...d, ...patch }));
          }
          ready.current = true;
          setState({ status:'on', error:'', at:new Date(), cached:snap.metadata.fromCache });
          clearTimeout(timer.current); timer.current = setTimeout(push, 300);
        }, err => setState({ status:'error', error:explainFbError(err), at:null }));
      } catch (e) { if (!dead) setState({ status:'error', error:explainFbError(e), at:null }); }
    })();
    return () => { dead = true; unsub(); ready.current = false; clearTimeout(timer.current); };
  }, [cfg, code]);

  useEffect(() => {
    if (state.status !== 'on') return;
    clearTimeout(timer.current); timer.current = setTimeout(push, 400);
    return () => clearTimeout(timer.current);
  }, [db, state.status]);

  const join = c => { const cc = cleanCode(c); if (cc.length < 20) return false; try { localStorage.setItem(FAM_KEY, cc); } catch (e) {} setCode(cc); return true; };
  const create = () => { const c = newFamilyCode(); join(c); return c; };
  const leave = () => { try { localStorage.removeItem(FAM_KEY); } catch (e) {} setCode(''); };
  return { cfg, code, status:state.status, error:state.error, at:state.at, cached:state.cached, join, create, leave };
}

function Indkoeb() {

  const timer = useRef(null);
  useEffect(() => () => clearInterval(timer.current), []);

  const left = items.filter(i => !i.done);

  };

  const submit = e => { e.preventDefault(); add(name, cat, who); setName(''); setWho([]); };
  const toggle = id => set('shopping', l => l.map(i => i.id === id ? { ...i, done:!i.done } : i));
  const remove = id => set('shopping', l => l.filter(i => i.id !== id));
  const runCheck = () => {
    if (checked) { set('dealsCheckedAt', null); return; }

      i++;

  const saving = dealItems.reduce((s, x) => s + (x.d.was - x.d.price), 0);
  const byStore = STORES.map(s => ({ s, n:dealItems.filter(x => x.d.store === s).length })).filter(x => x.n);
  const buildText = () => {
    const lines = [`Hej Claude! Tjek denne indkøbsliste mod ugens tilbudsaviser fra ${STORES.join(', ')}. Fortæl mig hvilke varer der er på tilbud, i hvilken butik og til hvilken pris, og foreslå hvilken butik eller kombination der giver den billigste tur.`, '', `Min indkøbsliste (uge ${isoWeek(new Date())}):`];

      <div className="seg"><button aria-pressed={false} onClick={() => setSub('liste')}>Indkøbsliste</button><button aria-pressed={true} onClick={() => setSub('lager')}>Lager</button></div>

function addToShopping(shopping, ings, pantry) {
  const out = [...shopping]; let added = 0; const skipped = [];
  ings.forEach(ing => { const nm = (ing || '').trim();
    if (nm && inPantry(pantry, nm)) { skipped.push(nm); return; }
    if (nm && !out.some(s => !s.done && s.name.toLowerCase() === nm.toLowerCase())) { out.push({ id:uid(), name:nm, cat:guessCat(nm), done:false, who:[] }); added++; } });
  return { list:mergeShopping(out).list, added, skipped };
}
const shopMsg = (added, skipped) => (added ? `${added} ${added === 1 ? 'vare' : 'varer'} lagt på indkøbslisten` : 'Intet nyt på indkøbslisten') + (skipped.length ? `. ${skipped.length} ${skipped.length === 1 ? 'vare' : 'varer'} sprunget over, fordi de er på lager (${skipped.slice(0, 3).join(', ')}${skipped.length > 3 ? ' …' : ''})` : '');
const catName = n => CATS.find(c => c.id === guessCat(n)).name;

/* ---------- Træning ---------- */
// Engangstræning har en dato (s.date); ugentlig har kun ugedag (s.day). Ældre træninger uden dato er ugentlige.
function sessionOn(s, k) { return s.date ? s.date === k : s.day === dayIdx(parse(k)); }
function nextDateFor(day) { const t = iso(new Date()); let d = iso(addDays(startOfWeek(new Date()), day)); if (d < t) d = iso(addDays(parse(d), 7)); return d; }
function findConflicts(sessions) {
  const out = [];
  for (let day = 0; day < 7; day++) {
    const l = sessions.filter(s => s.day === day);
    for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) {
      const a = l[i], b = l[j];
      const a0 = toMin(a.start), a1 = a0 + a.duration, b0 = toMin(b.start), b1 = b0 + b.duration;
      if (!(a0 < b1 && b0 < a1)) continue;
      if (a.driver && a.driver === b.driver) out.push({ day, kind:'driver', who:a.driver, a, b });
      else if (a.member === b.member) out.push({ day, kind:'member', who:a.member, a, b });
    }
  }
  return out;
}

const TASK_SIZES = [[1, 'Lille', 'fx tøm opvasker'], [3, 'Mellem', 'fx støvsug'], [5, 'Stor', 'fx gør badeværelset rent'], [10, 'Kæmpe', 'fx hele huset']];

function legacyWishProgress(db, w) {
  const adults = (db.members || []).filter(m => !m.child).map(m => m.id);
  const owners = w.owner === 'shared' ? adults : [w.owner];
  return (db.done || []).filter(x => x.date >= w.created && (x.who || []).some(id => owners.includes(id))).reduce((s, x) => s + (x.pts || 1), 0);
}
const wishProgress = (db, w) => Math.min(w.target, w.saved || 0);
const isAdultId = (d, id) => { const m = d.members.find(x => x.id === id); return !!m && !m.child; };
// Fordel point: først til den voksnes aktive ønsker (ældste først), resten ryger på pointkontoen
function allocPoints(d, id, pts, wishes, bank) {
  const alloc = []; let rest = pts;
  wishes = wishes.map(w => ({ ...w }));
  wishes.filter(w => !w.redeemed && (w.owner === id || w.owner === 'shared')).forEach(w => {
    const room = w.target - (w.saved || 0); if (room <= 0 || rest <= 0) return;
    const take = Math.min(room, rest); w.saved = (w.saved || 0) + take; rest -= take; alloc.push({ w:w.id, id, pts:take });
  });
  bank = { ...bank };
  if (rest > 0) { bank[id] = (bank[id] || 0) + rest; alloc.push({ w:'bank', id, pts:rest }); }
  return { wishes, bank, alloc };
}
function reverseAlloc(alloc, wishes, bank) {
  wishes = wishes.map(w => ({ ...w })); bank = { ...bank };
  (alloc || []).forEach(a => {
    if (a.w === 'bank') bank[a.id] = Math.max(0, (bank[a.id] || 0) - a.pts);
    else { const w = wishes.find(x => x.id === a.w); if (w && !w.redeemed) w.saved = Math.max(0, (w.saved || 0) - a.pts); }
  });
  return { wishes, bank };
}

        <ul className="flex flex-col gap-1">{recent.map(l => <li key={l.id} className="flex items-center gap-2 text-sm"><Dot color={memberFor(db, l.member).color} size={8} /><span className="truncate flex-1">{l.label}</span><span className="text-xs text-muted tnum">{fmtShort(parse(l.date))}</span><span className={`tnum font-semibold w-16 text-right ${l.amount < 0 ? 'text-muted' : 'text-goodink'}`}>{l.amount > 0 ? '+' : ''}{num(l.amount)}</span></li>)}</ul></div>}
    </section>
    {ask && <Modal title="Hvem har lavet opgaven?" onClose={() => setAsk(null)}>
      <div className="px-5 py-4 flex flex-col gap-3 text-sm">
        <p className="font-semibold">{ask.title}</p>
        <p className="text-muted">Vælg alle, der har lavet opgaven.{ask.reward > 0 ? ` Lommepengene (${money(ask.reward)}) deles ligeligt mellem dem.` : ''}</p>
        <div className="flex flex-wrap gap-2">{memsOf(ask).map(id => { const on = doers.includes(id); return <button key={id} type="button" className="chip" aria-pressed={on} onClick={() => setDoers(l => on ? l.filter(x => x !== id) : [...l, id])}><Dot color={memberFor(db, id).color} size={10} />{memberFor(db, id).name}</button>; })}</div>
        {doers.length > 1 && ask.reward > 0 && <p className="text-xs text-muted">Hver får {money(Math.round(ask.reward / doers.length * 100) / 100)}.</p>}
        <div className="flex gap-2 justify-end"><button className="btn" onClick={() => setAsk(null)}>Annullér</button>
          <button className="btn btn-primary" disabled={!doers.length} onClick={() => { move(ask, 'done', doers); setAsk(null); }}>Færdig</button></div>
      </div></Modal>}
    {modal && <TaskModal init={modal} onClose={() => setModal(null)} />}
    {reqM && <RequestModal {...reqM} onClose={() => setReqM(null)} />}
    {pay && <PayModal {...pay} onClose={() => setPay(null)} />}
  </div>;
}

/* ---------- Køleskabsdøren ---------- */
function Koeleskab() {
  const { db, set, notify } = useApp();
  const [text, setText] = useState(''); const [star, setStar] = useState(false); const [newQ, setNewQ] = useState(''); const [editQ, setEditQ] = useState(false); const [author, setAuthor] = useState(db.members[0].id); const [color, setColor] = useState('note1');
  const [off, setOff] = useState(0); const [rule, setRule] = useState({ text:'', day:-1 });
  const kids = db.members.filter(m => m.child);
  const ws = addDays(startOfWeek(new Date()), off * 7);
  const school = Array.from({ length:5 }, (_, i) => addDays(ws, i));
  const tomorrowKey = iso(addDays(new Date(), 1)); const today = iso(new Date()); const di = dayIdx(new Date());
  const quick = db.quickNotes || [];
  const saveQuick = v => { const t = (v || '').trim(); if (!t) return false; if (quick.some(q => q.toLowerCase() === t.toLowerCase())) return false; set('quickNotes', l => [...(l || []), t]); return true; };
  const post = (t) => { const v = (t ?? text).trim(); if (!v) return; set('notes', l => [{ id:uid(), text:v, author, color, pinned:true }, ...l]);
    if (t === undefined && star) { if (saveQuick(v)) notify('Gemt som hurtig tekst'); }
    setText(''); setStar(false); };
  const notes = [...db.notes].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  const cycle = (k, id) => set('lunch', L => { const cur = (L[k] || {})[id] || ''; const nxt = LUNCH_STATES[(LUNCH_STATES.findIndex(s => s.id === cur) + 1) % LUNCH_STATES.length].id; return { ...L, [k]:{ ...(L[k] || {}), [id]:nxt } }; });
  const stateOf = (k, id) => LUNCH_STATES.find(s => s.id === ((db.lunch[k] || {})[id] || '')) || LUNCH_STATES[0];
  const addRule = e => { e.preventDefault(); const v = rule.text.trim(); if (!v) return; set('rules', l => [...l, { id:uid(), text:v, day:Number(rule.day) }]); setRule(r => ({ ...r, text:'' })); };
  return <div>
    <PageHead icon="pin" tint="rose" title="Beskeder" sub="Hurtige beskeder, madpakker og huskeregler" />
    <section className="card p-4 mb-6 flex flex-col gap-3">
      <div className="flex flex-col sm:flex-row gap-2">
        <textarea id="note-text" className="field flex-1" rows={2} value={text} onChange={e => setText(e.target.value)} placeholder="Skriv en besked til familien" aria-label="Besked" />
        <button type="button" className="btn self-start sm:self-stretch" aria-pressed={star} title="Gem teksten som hurtig tekst" aria-label="Gem som hurtig tekst" onClick={() => setStar(s => !s)} style={star ? { color:'var(--warn)', borderColor:'var(--warn)', background:'var(--t-sun)' } : undefined}><Icon name="star" size={16} fill={star ? 'currentColor' : 'none'} /><span className="sm:hidden text-sm">Gem som hurtig tekst</span></button>
        <button className="btn btn-primary sm:self-stretch" onClick={() => post()}><Icon name="pin" size={16} />Hæng op</button>
      </div>
      <div className="flex flex-wrap items-center gap-x-5 gap-y-2">
        <div className="flex items-center gap-2"><span className="lbl mb-0">Fra</span><MemberPick value={author} onChange={setAuthor} /></div>
        <div className="flex items-center gap-2"><span className="lbl mb-0">Farve</span>{NOTE_COLORS.map(c => <button key={c} type="button" aria-label={`Farve ${c}`} aria-pressed={color === c} onClick={() => setColor(c)} className="w-7 h-7 rounded-full border-2" style={{ background:`var(--${c})`, borderColor:color === c ? 'var(--ink)' : 'var(--line)' }} />)}</div>
      </div>
      <div>
        <div className="flex items-center justify-between gap-2 mb-1.5"><span className="lbl mb-0">Hurtige tekster</span>
          {quick.length > 0 && <button type="button" className="text-xs font-semibold text-accent" onClick={() => setEditQ(v => !v)}>{editQ ? 'Færdig' : 'Redigér'}</button>}</div>
        <div className="flex flex-wrap gap-1.5">{quick.map(t => <span key={t} className="inline-flex items-center">
          <button className="chip" onClick={() => post(t)}><Icon name="plus" size={13} />{t}</button>
          {editQ && <button type="button" className="iconbtn" style={{ width:28, height:28 }} aria-label={`Slet hurtig tekst ${t}`} onClick={() => set('quickNotes', l => l.filter(x => x !== t))}><Icon name="x" size={14} /></button>}</span>)}
          {quick.length === 0 && <span className="text-sm text-muted">Ingen endnu. Tilføj dem, I bruger tit, fx "Husk madpakke i morgen". Tryk på stjernen ved en besked for at gemme den her.</span>}</div>
        <form className="flex gap-2 mt-2" onSubmit={e => { e.preventDefault(); if (saveQuick(newQ)) setNewQ(''); else if (newQ.trim()) notify('Den findes allerede'); }}>
          <input className="field" value={newQ} onChange={e => setNewQ(e.target.value)} placeholder="Ny hurtig tekst" aria-label="Ny hurtig tekst" />
          <button className="btn shrink-0" type="submit"><Icon name="plus" size={16} />Tilføj</button></form>
      </div>
    </section>
    {notes.length === 0 ? <div className="card mb-6"><Empty icon="pin" text="Ingen beskeder. Hæng den første op." /></div> :
      <div className="columns-1 sm:columns-2 xl:columns-3 gap-3 mb-8">{notes.map(n => <article key={n.id} className="break-inside-avoid mb-3 rounded-xl p-4 text-ink" style={{ background:`var(--${n.color})`, border:'1px solid var(--line)' }}>
        <p className="font-semibold leading-snug whitespace-pre-wrap">{n.text}</p>
        <div className="flex items-center justify-between mt-3 gap-2"><Who id={n.author} small />
          <span className="flex items-center"><button className="iconbtn" style={{ width:30, height:30, color:quick.includes(n.text) ? 'var(--warn)' : undefined }} aria-pressed={quick.includes(n.text)} aria-label="Gem som hurtig tekst" title="Gem som hurtig tekst" onClick={() => { if (quick.includes(n.text)) { set('quickNotes', l => l.filter(x => x !== n.text)); } else if (saveQuick(n.text)) notify('Gemt som hurtig tekst'); }}><Icon name="star" size={15} fill={quick.includes(n.text) ? 'currentColor' : 'none'} /></button><button className="iconbtn" style={{ width:30, height:30, color:n.pinned ? 'var(--accent)' : undefined }} aria-pressed={n.pinned} aria-label={n.pinned ? 'Tag af forsiden' : 'Vis på forsiden'} title={n.pinned ? 'Vises øverst på forsiden. Tryk for at tage af.' : 'Vis øverst på forsiden'} onClick={() => set('notes', l => l.map(x => x.id === n.id ? { ...x, pinned:!x.pinned } : x))}><Icon name="pin" size={15} /></button>
            <button className="iconbtn" style={{ width:30, height:30 }} aria-label="Fjern besked" onClick={() => set('notes', l => l.filter(x => x.id !== n.id))}><Icon name="x" size={15} /></button></span></div>
      </article>)}</div>}
    <div className="grid gap-4 lg:grid-cols-[1.5fr_1fr] items-start">
      <section className="card p-4 min-w-0">
        <SectionTitle right={<div className="flex items-center gap-1"><button className="iconbtn" aria-label="Forrige uge" onClick={() => setOff(o => o - 1)}><Icon name="left" size={16} /></button><span className="text-sm text-muted tnum">Uge {isoWeek(ws)}</span><button className="iconbtn" aria-label="Næste uge" onClick={() => setOff(o => o + 1)}><Icon name="right" size={16} /></button></div>}>Madpakkestatus</SectionTitle>
        {kids.length === 0 ? <Empty icon="users" text="Marker børn under Familie for at se madpakker." /> : <>
          <div className="rounded-xl bg-surface2 px-3 py-2 mb-3 text-sm flex flex-wrap gap-x-4 gap-y-1"><span className="font-semibold">I morgen:</span>{kids.map(k => <span key={k.id} className="inline-flex items-center gap-1.5"><Dot color={k.color} size={8} />{k.name}: <b className="font-semibold">{stateOf(tomorrowKey, k.id).label}</b></span>)}</div>
          <div className="overflow-x-auto"><table className="w-full text-sm min-w-[460px]"><thead><tr><th className="text-left lbl py-1 w-24"> </th>{school.map(d => <th key={iso(d)} className={`lbl text-center py-1 ${iso(d) === today ? 'text-accent' : ''}`}>{DS[dayIdx(d)]} {d.getDate()}</th>)}</tr></thead>
            <tbody>{kids.map(k => <tr key={k.id}><td className="py-1 pr-2"><Who id={k.id} small /></td>
              {school.map(d => { const k2 = iso(d); const s = stateOf(k2, k.id);
                return <td key={k2} className="p-0.5"><button onClick={() => cycle(k2, k.id)} className={`w-full rounded-lg border border-line bg-surface hover:bg-surface2 py-2 text-xs font-semibold ${s.cls}`} aria-label={`${k.name} ${DAYS[dayIdx(d)]}: ${s.label}. Tryk for at skifte.`}>{s.label}</button></td>; })}</tr>)}</tbody></table></div>
          <p className="text-xs text-muted mt-2">Tryk på en dag for at skifte mellem madpakke, skolemad, særligt og fri.</p></>}
      </section>
      <section className="card p-4 min-w-0">
        <SectionTitle>Huskeregler</SectionTitle>
        <ul className="flex flex-col gap-1 mb-3">{db.rules.map(r => { const now = r.day === -1 || r.day === di;
          return <li key={r.id} className="flex items-center gap-2 py-1.5 border-b border-line last:border-b-0">
            <span className="min-w-0 flex-1"><span className="block text-sm font-medium">{r.text}</span><span className="block text-xs text-muted">{r.day === -1 ? 'Hver dag' : `Hver ${DAYS[r.day].toLowerCase()}`}</span></span>
            {now && <span className="text-[11px] font-semibold rounded-full bg-warnsoft text-warn px-2 py-0.5">I dag</span>}
            <button className="iconbtn" aria-label="Fjern regel" onClick={() => set('rules', l => l.filter(x => x.id !== r.id))}><Icon name="x" size={15} /></button></li>; })}
          {!db.rules.length && <li className="text-sm text-muted">Ingen regler endnu.</li>}</ul>
        <form onSubmit={addRule} className="flex flex-col gap-2">
          <input id="rule-text" className="field" placeholder="Ny huskeregel" aria-label="Huskeregel" value={rule.text} onChange={e => setRule(r => ({ ...r, text:e.target.value }))} />
          <div className="flex gap-2"><select id="rule-day" className="field" aria-label="Dag" value={rule.day} onChange={e => setRule(r => ({ ...r, day:e.target.value }))}><option value={-1}>Hver dag</option>{DAYS.map((d, i) => <option key={d} value={i}>Hver {d.toLowerCase()}</option>)}</select>
            <button className="btn btn-primary" type="submit"><Icon name="plus" size={16} />Tilføj</button></div>
        </form>
      </section>
    </div>
  </div>;
}

function FamilyModal({ onClose }) {
  const { db, set } = useApp();
  const [ms, setMs] = useState(db.members.map(m => ({ ...m })));
  const upd = (id, p) => setMs(l => l.map(m => m.id === id ? { ...m, ...p } : m));
  const submit = e => { e.preventDefault(); set('members', ms.map(m => ({ ...m, name:m.name.trim() || m.id }))); onClose(); };
  return <FormModal title="Familiemedlemmer" onClose={onClose} onSubmit={submit}>
    <p className="text-sm text-muted">Giv hver person et navn og en farve. Farven bruges overalt i appen. Børn får lommepengekonto.</p>
    {ms.map(m => <div key={m.id} className="rounded-2xl border border-line p-3 flex flex-col gap-2.5">
      <div className="flex items-center gap-3">
        <Dot color={m.color} size={16} />
        <input className="field flex-1" value={m.name} onChange={e => upd(m.id, { name:e.target.value })} aria-label={`Navn for ${m.id}`} />
        <label className="flex items-center gap-1.5 text-sm shrink-0"><input type="checkbox" checked={m.child} onChange={e => upd(m.id, { child:e.target.checked })} />Barn</label>
      </div>
      <div className="flex flex-wrap gap-2">{SWATCHES.map(c => <button type="button" key={c} aria-label={`Farve ${c}`} onClick={() => upd(m.id, { color:c })}
        className="w-7 h-7 rounded-full" style={{ background:c, outline:m.color === c ? '3px solid var(--ink)' : 'none', outlineOffset:2 }} />)}</div>
    </div>)}
  </FormModal>;
}

const NAV = [
  { id:'overblik', label:'Overblik', icon:'home' },
  { id:'kalender', label:'Kalender', icon:'calendar' },
  { id:'foedselsdage', label:'Fødselsdage', icon:'cake' },
  { id:'indkoeb', label:'Indkøbsliste', icon:'cart' },
  { id:'madplan', label:'Madplan', icon:'utensils' },
  { id:'traening', label:'Træning', icon:'dumbbell' },
  { id:'pligter', label:'Opgaver', icon:'listchecks' },
  { id:'koeleskab', label:'Beskeder', icon:'pin' }
];
const TABS = ['overblik', 'kalender', 'pligter', 'indkoeb'];
const MORE = ['madplan', 'traening', 'foedselsdage', 'koeleskab'];
const VIEWS = { overblik:Overblik, kalender:Kalender, foedselsdage:Foedselsdage, indkoeb:Indkoeb, madplan:Madplan, traening:Traening, pligter:Pligter, koeleskab:Koeleskab };

function App() {
  const [db, setDb] = useState(loadDb);
  USER_CATS = db.catMap || {};
  const [toast, setToast] = useState(null); const [fam, setFam] = useState(false); const [share, setShare] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false); const [more, setMore] = useState(false);
  const [tick, setTick] = useState(0);
  const fsync = useFamilySync(db, setDb);
  const appFeeds = useAppFeeds(db);
  const shareDot = { on:'var(--good)', connecting:'var(--warn)', error:'var(--danger)' }[fsync.status] || 'var(--muted)';
  const shareLabel = fsync.status === 'on' ? 'Delt med familien' : fsync.status === 'error' ? 'Deling: fejl' : fsync.code ? 'Forbinder ...' : 'Del med familien';
  const toastTimer = useRef(null);
  const [ext, setExt] = useState(() => {
    try { const r = localStorage.getItem(EXT_KEY); if (r) return { status:'cached', data:JSON.parse(r), checked:null }; } catch (e) {}
    return { status:'idle', data:null, checked:null };
  });
  const refreshExt = async () => {
    setExt(x => ({ ...x, status:'loading' }));
    try {
      const res = await fetch('data/calendar-events.json?t=' + Date.now(), { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || !Array.isArray(data.events)) throw new Error('Ugyldigt format');
      try { localStorage.setItem(EXT_KEY, JSON.stringify(data)); } catch (e) {}
      setExt({ status:'ok', data, checked:new Date() });
    } catch (e) { setExt(x => ({ status:x.data ? 'cached' : 'none', data:x.data, checked:new Date() })); }
  };
  useEffect(() => {
    refreshExt();
    const t = setInterval(refreshExt, 10 * 60 * 1000);
    const t2 = setInterval(() => setTick(x => x + 1), 5 * 60 * 1000);
    const vis = () => { if (document.visibilityState === 'visible') { refreshExt(); setTick(x => x + 1); } };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(t); clearInterval(t2); document.removeEventListener('visibilitychange', vis); };
  }, []);

  const { extByDate, seriesCounts } = useMemo(() => {
    const m = {}; const counts = {};
    const hidden = db.feedHidden || {}; const fm = db.feedMap || {}; const ov = db.feedOverride || {}; const feeds = {};
    ((ext.data && ext.data.feeds) || []).forEach(f => { feeds[f.id] = f; });
    const push = (e, members, feedName) => {
      const sk = seriesKey(e.id);
      counts[sk] = (counts[sk] || 0) + 1;
      const mem = toArr(ov[e.id]).length ? toArr(ov[e.id]) : toArr(ov[sk]).length ? toArr(ov[sk]) : members;
      (m[e.date] = m[e.date] || []).push({ id:'x:' + e.id, rawId:e.id, seriesKey:sk, ext:true, title:e.title, date:e.date, start:e.start || '', end:e.end || '',
        members:mem.length ? mem : ['all'], feedName, location:e.location || '', note:e.desc || '', allDay:!!e.allDay, feed:e.feed });
    };
    if (ext.data) ext.data.events.forEach(e => {
      if (hidden[e.feed]) return; const f = feeds[e.feed] || {};
      push(e, toArr(fm[e.feed] || f.member || 'all'), f.name || e.feed);
    });
    (db.extFeeds || []).forEach(f => {
      const r = appFeeds.byFeed[f.id]; if (!r) return;
      r.events.forEach(e => push({ ...e, feed:'app-' + f.id }, toArr(f.member).length ? toArr(f.member) : ['all'], f.name));
    });
    return { extByDate:m, seriesCounts:counts };
  }, [ext.data, db.feedMap, db.feedHidden, db.feedOverride, db.extFeeds, appFeeds.byFeed]);
  const seriesCount = sk => seriesCounts[sk] || 0;
  const eventsFor = k => [
    ...db.events.filter(e => occursOn(e, k)).map(e => { const multi = (e.repeat || 'none') === 'none' && e.endDate && e.endDate > e.date; const n = multi ? daysBetween(parse(e.date), parse(e.endDate)) + 1 : 0; const i = multi ? daysBetween(parse(e.date), parse(k)) + 1 : 0;
      return { ...e, date:k, members:memsOf(e), seriesDate:e.date, title:multi ? `${e.title} (dag ${i}/${n})` : e.title, start:multi && i > 1 ? '' : e.start, end:multi && i < n ? '' : e.end }; }),
    ...(extByDate[k] || [])
  ];

  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} }, [db]);
  useEffect(() => {
    const r = document.documentElement;
    if (db.ui.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', db.ui.theme);
  }, [db.ui.theme]);
  // farvemigrering (gamle -> pastel), én gang
  useEffect(() => {
    if (db.members.some(m => OLD_COLORS[m.color])) setDb(d => ({ ...d, members:d.members.map(m => OLD_COLORS[m.color] ? { ...m, color:OLD_COLORS[m.color] } : m) }));
  }, []);
  // gentagne opgaver åbnes igen automatisk
  useEffect(() => {
    const now = new Date(); const tk = iso(now);
    const need = db.tasks.some(t => (t.status === 'done' && !t.doneDate) || (t.status === 'done' && isDueAgain(t, now)));
    if (!need) return;
    setDb(d => ({ ...d, tasks:d.tasks.map(t => {
      if (t.status !== 'done') return t;
      if (!t.doneDate) return taskRepeat(t) !== 'none' ? { ...t, doneDate:tk } : t;
      return isDueAgain(t, now) ? { ...t, status:'todo', doneDate:null } : t;
    }) }));
  }, [tick, db.tasks.length]);

  const set = (k, v) => setDb(d => ({ ...d, [k]:typeof v === 'function' ? v(d[k]) : v }));
  const up = fn => setDb(d => fn(d));
  const go = tab => { set('ui', u => ({ ...u, tab })); setMore(false); window.scrollTo(0, 0); };
  const notify = (msg, action) => { setToast({ msg, action }); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 4200); };
  const clearDemo = () => setDb(d => ({ ...emptyDb(), members:d.members, ui:d.ui, feedMap:d.feedMap || {}, feedHidden:d.feedHidden || {}, feedOverride:d.feedOverride || {}, extFeeds:d.extFeeds || [], settings:d.settings || {} }));
  const tab = VIEWS[db.ui.tab] ? db.ui.tab : 'overblik'; const View = VIEWS[tab];
  const isDark = db.ui.theme === 'dark' || (db.ui.theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const toggleTheme = () => set('ui', u => ({ ...u, theme:isDark ? 'light' : 'dark' }));
  const openSettings = () => { setMore(false); setSettingsOpen(true); };
  const openShare = () => { setMore(false); setShare(true); };
  const openFamily = () => { setMore(false); setFam(true); };
  const Brand = () => <div className="flex items-center gap-2.5 min-w-0">
    <img src={LOGO} alt="" width="38" height="38" className="rounded-xl shrink-0" style={{ boxShadow:'var(--shadow)' }} />
    <span className="min-w-0"><span className="block font-display font-semibold leading-tight">Familie J</span><span className="block text-xs text-muted tnum">Uge {isoWeek(new Date())}</span></span></div>;
  const tabItems = [...TABS.map(id => NAV.find(n => n.id === id)), { id:'__more', label:'Mere', icon:'more' }];
  const moreActive = MORE.includes(tab);
  return <Ctx.Provider value={{ db, set, up, go, notify, ext, refreshExt, eventsFor, fsync, appFeeds, seriesCount, openSettings, openShare, openFamily }}>
    <div className="min-h-screen lg:grid lg:grid-cols-[250px_1fr]">
      <aside className="hidden lg:flex flex-col gap-1 sticky top-0 h-screen border-r border-line bg-surface p-4">
        <div className="px-1 pb-4"><Brand /></div>
        <nav className="flex flex-col gap-0.5" aria-label="Moduler">{NAV.map(n => <button key={n.id} className="navbtn" aria-current={tab === n.id ? 'page' : undefined} onClick={() => go(n.id)}><Icon name={n.icon} size={19} />{n.label}</button>)}</nav>
        <span className="flex-1" />
        <button className="navbtn" onClick={openSettings}><Icon name="settings" size={19} />Indstillinger</button>
        <button className="navbtn" onClick={openShare}><Icon name="cloud" size={19} /><span className="flex-1">{shareLabel}</span><Dot color={shareDot} size={9} /></button>
        <button className="navbtn" onClick={openFamily}><Icon name="users" size={19} />Familie</button>
        <button className="navbtn" onClick={toggleTheme}><Icon name={isDark ? 'sun' : 'moon'} size={19} />{isDark ? 'Lyst tema' : 'Mørkt tema'}</button>
      </aside>
      <div className="min-w-0">
        <header className="lg:hidden sticky z-30 flex items-center justify-between gap-2 px-4 py-2.5 bg-surface border-b border-line" style={{ top:'env(safe-area-inset-top, 0px)' }}>
          <Brand />
          <span className="flex items-center"><button className="iconbtn relative" aria-label={shareLabel} onClick={openShare}><Icon name="cloud" /><span className="absolute top-1.5 right-1.5"><Dot color={shareDot} size={8} /></span></button>
            <button className="iconbtn" aria-label="Indstillinger" onClick={openSettings}><Icon name="settings" /></button></span>
        </header>
        <main className="w-full max-w-[1180px] mx-auto px-4 sm:px-6 lg:px-10 pt-5 pb-32 lg:pb-12">
          {db.demo && <div className="flex flex-wrap items-center justify-between gap-2 rounded-2xl bg-accentsoft text-ink px-4 py-2.5 mb-5 text-sm">
            <span className="flex items-center gap-2"><Icon name="sparkles" size={16} className="text-accent" />Du ser eksempeldata. Ret frit i det, eller ryd alt og start forfra.</span>
            <button className="btn btn-sm" onClick={clearDemo}>Ryd eksempeldata</button></div>}
          <View />
        </main>
      </div>
    </div>
    <nav className="lg:hidden tabbar" style={{ bottom:'calc(env(safe-area-inset-bottom, 0px) + 10px)' }} aria-label="Moduler">
      {tabItems.map(n => <button key={n.id} className="tabbtn" aria-current={(n.id === '__more' ? moreActive : tab === n.id) ? 'page' : undefined}
        onClick={() => n.id === '__more' ? setMore(true) : go(n.id)}><Icon name={n.icon} size={20} />{n.label}</button>)}
    </nav>
    {more && <Modal title="Mere" onClose={() => setMore(false)}>
      <div className="px-5 py-4 grid grid-cols-2 gap-3">
        {MORE.map(id => { const n = NAV.find(x => x.id === id); return <button key={id} className="card p-4 flex flex-col items-start gap-2 text-left font-semibold" onClick={() => go(id)}><Icon name={n.icon} size={22} className="text-accent" />{n.label}</button>; })}
        <button className="card p-4 flex flex-col items-start gap-2 text-left font-semibold" onClick={openSettings}><Icon name="settings" size={22} className="text-accent" />Indstillinger</button>
        <button className="card p-4 flex flex-col items-start gap-2 text-left font-semibold" onClick={openFamily}><Icon name="users" size={22} className="text-accent" />Familie</button>
        <button className="card p-4 flex flex-col items-start gap-2 text-left font-semibold" onClick={openShare}><Icon name="cloud" size={22} className="text-accent" />{shareLabel}</button>
        <button className="card p-4 flex flex-col items-start gap-2 text-left font-semibold" onClick={toggleTheme}><Icon name={isDark ? 'sun' : 'moon'} size={22} className="text-accent" />{isDark ? 'Lyst tema' : 'Mørkt tema'}</button>
      </div></Modal>}
    {toast && <div className="pop fixed z-[60] left-1/2 -translate-x-1/2 flex items-center gap-3 rounded-2xl bg-ink text-canvas px-4 py-2.5 text-sm shadow-xl max-w-[92vw]" style={{ bottom:'calc(env(safe-area-inset-bottom, 0px) + 92px)' }} role="status">
      <span>{toast.msg}</span>{toast.action && <button className="font-semibold underline" onClick={() => { toast.action.fn(); setToast(null); }}>{toast.action.label}</button>}</div>}
    {fam && <FamilyModal onClose={() => setFam(false)} />}
    {share && <ShareModal onClose={() => setShare(false)} />}
    {settingsOpen && <SettingsModal onClose={() => setSettingsOpen(false)} />}
  </Ctx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
