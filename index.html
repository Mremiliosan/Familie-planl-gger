const MS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const pad = n => String(n).padStart(2, '0');

const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayIdx = d => (d.getDay() + 6) % 7;
const startOfWeek = d => addDays(startOfDay(d), -dayIdx(d));
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const isoWeek = d => {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn);

  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
};

function nextBirthday(dateStr, today) {
  const b = parse(dateStr), m = b.getMonth(), dd = b.getDate();
  const mk = y => { let d = new Date(y, m, dd); if (m === 1 && dd === 29 && d.getMonth() !== 1) d = new Date(y, 1, 28); return d; };
  let n = mk(today.getFullYear());
  if (n < today) n = mk(today.getFullYear() + 1);
  const days = Math.round((n - today) / 86400000);
  const turning = n.getFullYear() - b.getFullYear();
  return { date: n, days, turning, age: days === 0 ? turning : turning - 1 };
}
function birthdaysOn(list, date) {
  return list.filter(b => {
    const x = parse(b.date), y = date.getFullYear();
    if (y < x.getFullYear()) return false;
    let m = x.getMonth(), d = x.getDate();
    if (m === 1 && d === 29 && !isLeap(y)) d = 28;
    return date.getMonth() === m && date.getDate() === d;
  });
}

    if (checked) { set('dealsCheckedAt', null); return; }

    timer.current = setInterval(() => {
      i++;
      if (i >= STORES.length) {
        clearInterval(timer.current); setStep(-1); set('dealsCheckedAt', iso(new Date()));

  const saving = dealItems.reduce((s, x) => s + (x.d.was - x.d.price), 0);

function findConflicts(sessions) {
  const out = [];
  for (let day = 0; day < 7; day++) {
    const l = sessions.filter(s => s.day === day);
    for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) {
      const a = l[i], b = l[j];
      const a0 = toMin(a.start), a1 = a0 + a.duration, b0 = toMin(b.start), b1 = b0 + b.duration;
      if (!(a0 < b1 && b0 < a1)) continue;
      if (a.driver && a.driver === b.driver) out.push({ day, kind:'driver', who:a.driver, a, b });
      else if (a.member === b.member) out.push({ day, kind:'member', who:a.member, a, b });
    }
  }
  return out;
}

  });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || !Array.isArray(data.events)) throw new Error('Ugyldigt format');
      try { localStorage.setItem(EXT_KEY, JSON.stringify(data)); } catch (e) {}
      setExt({ status:'ok', data, checked:new Date() });

        <header className="lg:hidden sticky z-30 flex items-center justify-between gap-2 px-4 py-2.5 bg-surface border-b border-line" style={{ top:'env(safe-area-inset-top, 0px)' }}>
          <Brand />
          <span className="flex items-center"><button className="iconbtn" aria-label="Familie" onClick={() => setFam(true)}><Icon name="users" /></button>
            <button className="iconbtn" aria-label="Skift tema" onClick={toggleTheme}><Icon name={isDark ? 'sun' : 'moon'} /></button></span>
        </header>
        <main className="w-full max-w-[1180px] mx-auto px-4 sm:px-6 lg:px-10 pt-5 pb-28 lg:pb-12">
          {db.demo && <div className="flex flex-wrap items-center justify-between gap-2 rounded-xl bg-accentsoft text-ink px-4 py-2.5 mb-5 text-sm">
            <span className="flex items-center gap-2"><Icon name="sparkles" size={16} className="text-accent" />Du ser eksempeldata. Ret frit i det, eller ryd alt og start forfra.</span>
            <button className="btn btn-sm" onClick={clearDemo}>Ryd eksempeldata</button></div>}
          <View />
        </main>
      </div>
    </div>
    <nav className="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-surface border-t border-line flex overflow-x-auto noscroll gap-1 px-2 pt-1.5" style={{ paddingBottom:'calc(env(safe-area-inset-bottom, 0px) + 6px)' }} aria-label="Moduler">
      {NAV.map(n => <button key={n.id} className="tabbtn" aria-current={tab === n.id ? 'page' : undefined} onClick={() => go(n.id)}><Icon name={n.icon} size={20} />{n.label}</button>)}
    </nav>
    {toast && <div className="pop fixed z-[60] left-1/2 -translate-x-1/2 flex items-center gap-3 rounded-xl bg-ink text-canvas px-4 py-2.5 text-sm shadow-xl max-w-[92vw]" style={{ bottom:'calc(env(safe-area-inset-bottom, 0px) + 84px)' }} role="status">
      <span>{toast.msg}</span>{toast.action && <button className="font-semibold underline" onClick={() => { toast.action.fn(); setToast(null); }}>{toast.action.label}</button>}</div>}
    {fam && <FamilyModal onClose={() => setFam(false)} />}
  </Ctx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
